services:
  primary:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_REPLICATION_PASSWORD: "${POSTGRES_REPLICATION_PASSWORD}"
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c wal_keep_size=256MB
    configs:
      - source: init_primary
        target: /docker-entrypoint-initdb.d/init-primary.sh
    volumes:
      - primary_data:/var/lib/postgresql/data
    ports:
      - "5442:5432"

  replica:
    image: postgres:16
    user: postgres
    depends_on:
      - primary
    environment:
      PGPASSWORD: "${POSTGRES_REPLICATION_PASSWORD}"
    entrypoint:
      - bash
      - -c
    command:
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          until pg_basebackup \
            -h primary \
            -U replicator \
            -D "$$PGDATA" \
            -R \
            -X stream \
            -C \
            -S replica1_slot
          do
            sleep 2
          done

          chmod 700 "$$PGDATA"
        fi

        exec postgres
    volumes:
      - replica_data:/var/lib/postgresql/data
    ports:
      - "5443:5432"

configs:
  init_primary:
    content: |
      #!/bin/bash
      set -e

      psql -v ON_ERROR_STOP=1 \
        -v repl_password="$${POSTGRES_REPLICATION_PASSWORD}" \
        -U postgres <<'SQL'
      CREATE ROLE replicator
        WITH REPLICATION LOGIN
        PASSWORD :'repl_password';
      SQL

      echo "host replication replicator all scram-sha-256" \
        >> "$$PGDATA/pg_hba.conf"

volumes:
  primary_data:
  replica_data: